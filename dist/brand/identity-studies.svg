<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930"><rect width="1600" height="930" fill="#111311"/><text x="70" y="80" font-family="Arial" font-size="16" letter-spacing="3" fill="#e8ab62">ASIMULATION / IDENTITY STUDIES</text><text x="70" y="148" font-family="Georgia" font-size="47" fill="#e8e9df">Three ways to hold an open question.</text><rect x="60" y="210" width="480" height="550" fill="#1a201b" stroke="#32392f"/><g transform="translate(155 265) scale(2.9)"><path d="M26 74 49 22Q51 18 54 23L78 74M35 56h33" fill="none" stroke="#e8e9df" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 53C10 84 68 97 88 52" fill="none" stroke="#e8ab62" stroke-width="3" stroke-linecap="round"/><circle cx="86" cy="38" r="5" fill="#e8ab62"/>
</g><text x="95" y="645" font-family="Arial" font-size="26" fill="#e8e9df">01 / The open orbit</text><text x="95" y="690" font-family="Arial" font-size="17" fill="#a0aaa0">An initial. A boundary. A possibility.</text><rect x="570" y="210" width="480" height="550" fill="#1a201b" stroke="#32392f"/><g transform="translate(665 265) scale(2.9)"><path d="M73 31C63 13 28 18 22 43S32 83 53 80C78 76 79 44 62 39C49 35 33 49 39 61C44 72 64 62 68 51" fill="none" stroke="#e8e9df" stroke-width="4" stroke-linecap="round"/><circle cx="78" cy="23" r="5" fill="#e8ab62"/></g><text x="605" y="645" font-family="Arial" font-size="26" fill="#e8e9df">02 / The living loop</text><text x="605" y="690" font-family="Arial" font-size="17" fill="#a0aaa0">Continuity, feedback, and becoming.</text><rect x="1080" y="210" width="480" height="550" fill="#1a201b" stroke="#32392f"/><g transform="translate(1175 265) scale(2.9)"><path d="M20 70Q20 25 50 20Q80 25 80 70M20 70Q50 43 80 70" fill="none" stroke="#e8e9df" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="55" r="6" fill="#e8ab62"/><path d="M31 81h38" stroke="#e8ab62" stroke-width="3" stroke-linecap="round"/></g><text x="1115" y="645" font-family="Arial" font-size="26" fill="#e8e9df">03 / The habitat</text><text x="1115" y="690" font-family="Arial" font-size="17" fill="#a0aaa0">An agent held within its environment.</text><text x="70" y="839" font-family="Arial" font-size="17" fill="#a0aaa0">Ivory / Charcoal / Amber. Independent identity, related to Metaversal Arts.</text><text x="70" y="877" font-family="Arial" font-size="15" fill="#a0aaa0">Concept 01 is used in the first website and social assets. All marks are editable vectors.</text></svg>